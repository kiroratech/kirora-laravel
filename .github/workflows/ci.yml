name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request makes an older run pointless. Runs on main all
# finish, so every commit there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Until kirora/kirora-php is on Packagist, composer.json requires it from ../kirora-php,
# so each job checks both repositories out side by side. Once it's published, drop the
# path repository and the second checkout, and these jobs run from the workspace root.
defaults:
  run:
    working-directory: kirora-laravel

jobs:
  # Checks whose result doesn't depend on the PHP or Laravel version, so they run once.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: kirora-laravel
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kiroratech/kirora-php
          path: kirora-php
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer format:check
      - run: composer analyse
      - run: composer audit --no-dev
      # A release tag must match KiroraServiceProvider::VERSION, which the User-Agent reports.
      - name: tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n "s/^    public const VERSION = '\(.*\)';$/\1/p" src/KiroraServiceProvider.php)
          test "v$version" = "$GITHUB_REF_NAME" || (echo "tag $GITHUB_REF_NAME, but VERSION is $version" && exit 1)

  test:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        dependencies: [highest]
        exclude:
          # Laravel 13 needs PHP 8.3.
          - php: '8.2'
            laravel: '13'
        include:
          - php: '8.2'
            laravel: '12'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kirora-laravel
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kiroratech/kirora-php
          path: kirora-php
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: install
        run: |
          composer update --no-interaction --no-progress \
            --with="laravel/framework:^${{ matrix.laravel }}" \
            ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
      - run: composer test
